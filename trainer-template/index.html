<title>Language Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: single column app, top bar with today's progress, tile-like cards inspired by İznik ceramics */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --ink:#14243a; --muted:#5d6b7e; --line:#d9e1ea;
  --cobalt:#1f4f8f; --turq:#138a8a; --coral:#c8473b; --good:#2e7d4f; --warn:#b7791f;
  --chip:#e6eef7;
  --display:"Rubik",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1622; --surface:#16212f; --ink:#e7eef7; --muted:#9aa9bb; --line:#2a394c;
  --cobalt:#7fb0f0; --turq:#4cc7c2; --coral:#f08074; --good:#6fcf97; --warn:#f2c066; --chip:#1e2d40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1622; --surface:#16212f; --ink:#e7eef7; --muted:#9aa9bb; --line:#2a394c;
  --cobalt:#7fb0f0; --turq:#4cc7c2; --coral:#f08074; --good:#6fcf97; --warn:#f2c066; --chip:#1e2d40; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:1.6rem;color:var(--cobalt)}
h2{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px}
button:hover{border-color:var(--cobalt)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--turq);outline-offset:2px}
button.primary{background:var(--cobalt);color:var(--surface);border-color:var(--cobalt);font-weight:600}
button.ghost{background:transparent}
button:disabled{opacity:.5;cursor:default}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top>div:first-child{flex:1 1 220px;min-width:0}
.stats{display:flex;gap:10px;flex:0 1 400px;min-width:0}
.stat{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat.goal{background:var(--good);border-color:var(--good)}
.stat.goal b,.stat.goal span{color:var(--surface)}
.stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.today{border-color:var(--cobalt);border-width:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.set{text-align:left;display:flex;flex-direction:column;gap:6px;padding:12px}
.set .t{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.pill{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.pill.due{background:var(--coral);color:var(--surface)}
.pill.ok{background:var(--good);color:var(--surface)}
.pill.known{background:var(--turq);color:var(--surface)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modes>button:first-child:nth-last-child(odd){grid-column:1/-1} /* with an odd number of buttons the first one fills its row */
.modes button{padding:14px;text-align:left}
.modes button b{display:block;font-family:var(--display)}
.card{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;
  border:2px solid var(--line);border-radius:16px;padding:24px;background:var(--surface);cursor:pointer}
.card .big{font-family:var(--display);font-size:2rem;font-weight:700;overflow-wrap:anywhere}
.card .ans{font-size:1.2rem;color:var(--cobalt)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match button{text-align:left;overflow-wrap:anywhere;min-height:48px}
.match button.sel{border-color:var(--cobalt);box-shadow:0 0 0 2px var(--cobalt) inset}
.match button.done{opacity:.35;pointer-events:none;border-color:var(--good)}
.match button.bad{border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.match button.bad{animation:none}}
input[type=text]{font:inherit;font-size:1.2rem;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
#nsBox{display:flex;flex-direction:column;gap:10px;margin-top:4px}
#nsBox .row{margin:0}
.keys button{padding:6px 12px;font-size:1.05rem}
.fb{padding:10px 14px;border-radius:10px;font-weight:500}
.fb.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.fb.bad{background:color-mix(in srgb,var(--coral) 15%,transparent);color:var(--coral)}
.fb.near{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.progress{font-variant-numeric:tabular-nums}
.knownTile{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);width:100%}
.knownTile .star{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:color-mix(in srgb,var(--turq) 16%,transparent);color:var(--turq)}
.knownTile .t{font-family:var(--display);font-weight:600;font-size:1.02rem}
.knownTile .n{margin-left:auto;font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--turq);font-variant-numeric:tabular-nums}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.kchip{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.kchip .w{flex:1;min-width:0}
.kchip .w b{display:block;overflow-wrap:anywhere}
.kchip .w span{display:block;font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.kchip button{flex:none;padding:5px 9px;font-size:.8rem}
.kgroup h3{font-size:.95rem;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:baseline}
.wf{gap:12px;border-color:var(--cobalt);background:color-mix(in srgb,var(--cobalt) 5%,var(--surface))}
.wf .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.wf label{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.wf input{font:inherit;font-size:1.05rem;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;width:100%;transition:border-color .15s,box-shadow .15s}
.wf input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.wf input:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px color-mix(in srgb,var(--cobalt) 22%,transparent)}
.wf .flag{font-size:1rem;margin-right:4px}
.notice{font-size:.85rem;color:var(--warn)}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.mdbody{display:flex;flex-direction:column;gap:8px;line-height:1.6}
.mdbody h2{font-size:1.3rem;color:var(--cobalt)}.mdbody h3{font-size:1.05rem;margin-top:8px}
.mdbody p,.mdbody ul,.mdbody ol{margin:0}
table.md{border-collapse:collapse;font-size:.92rem}table.md th,table.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}table.md th{background:var(--chip)}
details{border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer}
@media (max-width:480px){.card .big{font-size:1.6rem}.match{gap:6px}}
.tw{cursor:pointer;border-radius:4px;text-decoration:underline dotted color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:3px}
.tw:hover,.tw.on{background:color-mix(in srgb,var(--cobalt) 16%,transparent)}
#wpop{position:absolute;z-index:50;width:min(320px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1.5px solid var(--cobalt);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:8px;font-size:.95rem;font-weight:400;text-align:left}
#wpop .wl{font-family:var(--display);font-size:1.15rem;font-weight:700}
#wpop .row{gap:6px}
.lvl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}
.stat.click{cursor:pointer;text-align:left;font:inherit;color:inherit}
.stat.click:hover{border-color:var(--cobalt)}
.stat.click span::after{content:" ›"}
.pill.new{background:var(--chip);color:var(--muted)}
.pill.learn{background:var(--coral);color:var(--surface)}
.pill.fam{background:var(--warn);color:var(--surface)}
.exs{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.exb{display:flex;flex-direction:column;gap:10px;padding-top:8px;border-top:1px solid var(--line)}
.exi{display:flex;flex-direction:column;gap:6px}
.exrow{display:flex;gap:8px;align-items:flex-start}
.exrow input,.exrow textarea{flex:1;min-width:0;font:inherit;font-size:1.02rem;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.exrow input:focus,.exrow textarea:focus{outline:none;border-color:var(--cobalt)}
.exrow button{flex:none}
.lvlb{background:none;border:0;padding:4px 0;text-align:left;cursor:pointer}
.lvlb:hover{color:var(--cobalt)}
.offer{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--surface);color:var(--ink);font-weight:400;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>

<div class="wrap" id="app">
  <div class="top">
    <div>
      <h1 id="ttl">Trainer</h1>
      <div class="muted small" id="sub"></div>
    </div>
    <div class="stats">
      <button class="stat click" id="dueTile" title="Что повторить сегодня"><b id="sDue">–</b><span>к повтору</span></button>
      <div class="stat"><b id="sMin">0</b><span>минут сегодня</span></div>
      <div class="stat"><b id="sStreak">0</b><span>дней подряд</span></div>
    </div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="view"></div>
</div>

<script>
(() => {
// ===== SETUP: Claude fills this in for the learner =====
const CONFIG={
  // language being learned
  targetLang:'Turkish',      // English name, used in Claude's checking prompts
  targetLabel:'Türkçe',      // its own name: title and input labels
  targetCode:'tr',           // BCP-47 code: pronunciation and lower-casing
  letters:['ç','ğ','ı','İ','ö','ş','ü'],              // on-screen keys for special letters
  letterMap:{'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u','â':'a','î':'i'}, // special letter -> plain; a plain-letter answer counts as 'almost'
  pronouns:['ben','sen','o','biz','siz','onlar'],    // subject pronouns that may be dropped in grammar answers
  // learner's own language
  nativeLang:'Russian',      // English name: translations and feedback language
  nativeCode:'ru',
  // UI words (the UI is in Russian; translate all UI text if the learner's language differs)
  ui:{tAdv:'по-турецки',tNeut:'турецкое',tAdj:'турецкий',tDat:'турецкому',tPl:'турецкие',nAdj:'русский',nNeut:'русское',nDat:'русскому',nLabel:'Русский'},
  level:'A1',                // CEFR level the learner is studying now
  book:'',                   // textbook title, or '' if none
  covered:'',                // what the book covers so far, e.g. 'pages 1-40: present tense, cases'
  dailyMinutes:15,           // daily goal: the minutes counter turns green at this
  newPerDay:12               // new words introduced per day
};
// =======================================================
const U=CONFIG.ui, TC=CONFIG.targetCode.toUpperCase(), NC=CONFIG.nativeCode.toUpperCase();
const INTERVALS=[0,1,2,4,7,14,30,60]; // days per box
const NEW_PER_DAY=CONFIG.newPerDay;
let WORDS=[], SETS=[], RULES=[], GRAM={}, BASE=[];
let state={items:{},daily:{},log:[],custom:{add:[],edit:{},del:[]},requests:[]};
let db=null, docRef=null, saveTimer=null, tts=null;
const $=s=>document.querySelector(s);
const view=()=>$('#view');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const key=w=>'w:'+w.tr;
const it=w=>state.items[key(w)];
const isKnown=w=>!!(it(w)&&it(w).known);
const isDue=w=>{const x=it(w);return x&&!x.known&&x.due<=today()};
const isNew=w=>!it(w);
// material the learner already covered in the book before starting: starts as "familiar" (yellow), not "new"
const covSet=id=>{const s=SETS.find(x=>x.id===id);return !!(s&&s.covered)};
const isCov=w=>!it(w)&&!w.added&&covSet(w.set);
const ruleCov=id=>{const r=RULES.find(x=>x.id===id);return !!(r&&r.covered)};
const startItem=cov=>cov?{b:3,c:0,w:0,cv:1}:{b:0,c:0,w:0};
// progress made before covered material started as "familiar": raise never-missed items below 3 by 3 (once per item)
// a rule prepared on request: rules.json "from": "YYYY-MM-DD" is the first day it comes up for review; its request is marked done
function startRequested(){for(const r of RULES){if(r.planned)continue;const k='r:'+r.id;
    if(r.from&&!state.items[k]) state.items[k]={b:0,c:0,w:0,due:r.from,first:today()};
    for(const q of (state.requests||[])) if(q.kind==='rule'&&q.id===r.id&&!q.done){q.done=true;q.doneD=today()}}}
function migrateCovered(){let ch=false;const ws=new Map(WORDS.map(w=>[key(w),w]));
  for(const [k,x] of Object.entries(state.items)){if(x.cv)continue;let cov=false;
    if(k.startsWith('w:')){const w=ws.get(k);cov=!!(w&&!w.added&&covSet(w.set))}else if(k.startsWith('r:'))cov=ruleCov(k.slice(2));
    if(!cov)continue; if(!x.known&&!x.w&&(x.b||0)<3)x.b=(x.b||0)+3; x.cv=1; ch=true}
  return ch}
// folded levels on the home screen (remembered in this browser)
const FOLD=()=>{try{return JSON.parse(localStorage.getItem('tt_fold')||'[]')}catch(e){return[]}};
const pref=k=>!!((state.prefs||{})[k]);
function togglePref(k){state.prefs=Object.assign({},state.prefs||{},{[k]:!pref(k)});scheduleSave();const y=scrollY;home();scrollTo(0,y)}
const setDone=st=>st.total>0&&st.k===st.total;
function toggleFold(l){let f=FOLD();f=f.includes(l)?f.filter(x=>x!==l):f.concat(l);try{localStorage.setItem('tt_fold',JSON.stringify(f))}catch(e){}const y=scrollY;home();scrollTo(0,y)}
const lvlHead=(l,label,grid)=>l?`<button class="lvl lvlb" data-fold="${esc(l)}"${grid?' style="grid-column:1/-1"':''}>${FOLD().includes(l)?'▸':'▾'} ${esc(label)}</button>`:`<div class="lvl"${grid?' style="grid-column:1/-1"':''}>${esc(label)}</div>`;
const LEVELS=()=>[...new Set(SETS.filter(s=>s.level).map(s=>s.level).concat(RULES.map(r=>r.level).filter(Boolean)))];

// ---------- persistence ----------
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(save,1200)}
async function save(){
  try{localStorage.setItem('tt_state',JSON.stringify(state))}catch(e){}
  if(!docRef) return;
  try{await docRef.set(state)}catch(e){
    if(e&&e.code==='unavailable'){setTimeout(()=>docRef.set(state).catch(()=>{}),1500+Math.random()*1000)}
    else showNotice('Не удалось сохранить прогресс на сервере. Он сохранён в этом браузере.');
  }
}
function showNotice(t){const n=$('#notice');n.textContent=t;n.hidden=false}

// study time tracking: count active seconds while a drill is open
let activeTick=null;
function startTimer(){stopTimer();activeTick=setInterval(()=>{if(document.hidden)return;const d=today();state.daily[d]=(state.daily[d]||0)+5;renderStats();if(state.daily[d]%30===0)scheduleSave()},5000)}
function stopTimer(){if(activeTick){clearInterval(activeTick);activeTick=null;scheduleSave()}}

function grade(w,result){ // result: 'ok' | 'bad' | 'near' | 'okSoft'
  const k=key(w); const x=state.items[k]||startItem(isCov(w));
  if(result==='ok'){x.b=Math.min(x.b+1,INTERVALS.length-1);x.c++}
  else if(result==='okSoft'){ if(x.b<3) x.b++; x.c++ }
  else if(result==='near'){ x.w++ }
  else { x.b=Math.max(0,x.b-2); x.w++ }
  x.due=(result==='bad'||result==='near')?today():addDays(INTERVALS[x.b]);
  x.last=today();
  state.items[k]=x; scheduleSave(); renderStats();
}
function markKnown(w,on=true){const k=key(w);const x=state.items[k]||{b:0,c:0,w:0};x.known=on;x.last=today();if(!on){x.b=Math.max(x.b,3);x.due=today()}state.items[k]=x;scheduleSave();renderStats()}

function streak(){let n=0;const d=new Date();for(;;){const s=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if((state.daily[s]||0)>=60){n++;d.setDate(d.getDate()-1)}else{if(n===0&&s===today()){d.setDate(d.getDate()-1);continue}break}}return n}
function dueWords(){return WORDS.filter(isDue)}
const ruleKnown=id=>!!(state.items['r:'+id]||{}).known;
function markRuleKnown(id,on){const k='r:'+id;const x=state.items[k]||{b:0,c:0,w:0};x.known=on;x.last=today();if(!on){x.b=Math.max(x.b,3);x.due=today()}state.items[k]=x;scheduleSave();renderStats()}
function dueRules(){return RULES.filter(r=>{if(r.planned)return false;const x=state.items['r:'+r.id];return x&&!x.known&&x.due<=today()})}
function renderStats(){$('#sDue').textContent=dueWords().length+dueRules().length;const mins=Math.floor((state.daily[today()]||0)/60);$('#sMin').textContent=mins;$('#sMin').parentElement.classList.toggle('goal',mins>=CONFIG.dailyMinutes);$('#sStreak').textContent=streak()}

function newToday(){ // count words first seen today
  return Object.entries(state.items).filter(([k,v])=>k.startsWith('w:')&&v.first===today()&&!v.known&&!v.bonus).length}
function todayPool(extra=0){
  const due=shuffle(dueWords());
  const room=Math.max(0,NEW_PER_DAY-newToday())+extra;
  const nw=WORDS.filter(isNew); const fresh=nw.filter(w=>w.added).concat(nw.filter(w=>!w.added)).slice(0,room); // the learner's own words first, then book order
  return due.concat(fresh);
}
// colour of a word: same colours as the legend
function wstat(w){const x=it(w);if(!x)return isCov(w)?{c:'fam',t:'знакомое'}:{c:'new',t:'новое'};if(x.known)return{c:'known',t:'★ знаю точно'};if(x.b>=5)return{c:'ok',t:'выучено'};if(x.b>=3)return{c:'fam',t:'знакомое'};return{c:'learn',t:'учу'}}
const wtip=w=>{const x=it(w);if(!x&&isCov(w))return 'пройдено в книге, ещё не проверено в тренажёре';return x&&!x.known?`уровень ${x.b} из 7, повтор ${x.due<=today()?'сегодня':x.due.split('-').reverse().join('.')}`:''};
function rstat(id){const x=state.items['r:'+id];const tip=x&&!x.known?`уровень ${x.b} из 7, повтор ${x.due<=today()?'сегодня':x.due.split('-').reverse().join('.')}`:'';
  if(!x)return ruleCov(id)?{c:'fam',t:'знакомое',tip:'пройдено в книге, ещё не проверено в тренажёре'}:{c:'new',t:'новое',tip:''};
  if(x.known)return{c:'known',t:'★ знаю точно',tip};if(x.b>=5)return{c:'ok',t:'выучено',tip};if(x.b>=3)return{c:'fam',t:'знакомое',tip};return{c:'learn',t:'учу',tip}}
function setStats(s){const ws=WORDS.filter(w=>w.set===s.id);let n=0,l=0,f=0,k=0;for(const w of ws){const x=it(w);if(!x){if(isCov(w))f++;else n++}else if(x.known||x.b>=5)k++;else if(x.b>=3)f++;else l++}return{total:ws.length,n,l,f,k}}

// ---------- words the learner added, corrected or deleted (stored with their progress) ----------
function cust(){const c=state.custom=state.custom||{};c.add=c.add||[];c.edit=c.edit||{};c.del=c.del||[];c.sets=c.sets||[];return c}
function applyCustom(){
  const c=cust(); WORDS=[];
  for(const b of BASE){ if(c.del.includes(b.tr)) continue; const e=c.edit[b.tr]; WORDS.push(e?{tr:e.tr,ru:e.ru,set:b.set,orig:b.tr}:{tr:b.tr,ru:b.ru,set:b.set,orig:b.tr}) }
  for(const s of c.sets) if(!SETS.some(x=>x.id===s.id)) SETS.splice(SETS.indexOf(EX_SET)<0?SETS.length:SETS.indexOf(EX_SET),0,Object.assign({words:[],own:true},s));
  for(const a of c.add) WORDS.push({tr:a.tr,ru:a.ru,set:SETS.some(x=>x.id===a.set)?a.set:EX_SET.id,added:true});
}
// move a word the learner added to another set (progress stays with the word)
function moveAdded(tr,setId){const a=cust().add.find(x=>x.tr===tr);if(a)a.set=setId}
function newSet(ru,tr){const c=cust();const id='my_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);c.sets.push({id,ru,tr:tr||'',level:''});applyCustom();return id}
const setList=()=>SETS.filter(x=>x.id!==EX_SET.id).map(x=>x.id+' = '+x.ru).join('; ');
function moveProgress(oldTr,newTr){if(oldTr===newTr)return;const o=state.items['w:'+oldTr];if(o){state.items['w:'+newTr]=o;delete state.items['w:'+oldTr]}}
function saveWord(w,tr,ru,setId){ // w = existing word (edit) or null (add)
  const c=cust();
  if(!w){c.add.push({tr,ru,set:setId})}
  else if(w.added){const a=c.add.find(x=>x.tr===w.tr&&x.set===w.set); if(a){a.tr=tr;a.ru=ru} moveProgress(w.tr,tr)}
  else {c.edit[w.orig]={tr,ru}; moveProgress(w.tr,tr)}
  applyCustom(); scheduleSave(); renderStats();
}
function deleteWord(w){
  const c=cust();
  if(w.added) c.add=c.add.filter(x=>!(x.tr===w.tr&&x.set===w.set)); else {c.del.push(w.orig); delete c.edit[w.orig]}
  delete state.items['w:'+w.tr]; applyCustom(); scheduleSave(); renderStats();
}
async function checkWord(tr,ru,setName){
  if(!sampler) return null;
  const prompt=`You are a precise ${CONFIG.targetLang}–${CONFIG.nativeLang} dictionary editor helping a ${CONFIG.nativeLang}-speaking ${CONFIG.level} learner build their word list. Word set topic: "${setName}".
${CONFIG.targetLang} given: ${tr||'(empty)'}
${CONFIG.nativeLang} given: ${ru||'(empty)'}

Rules:
- If only ${CONFIG.targetLang} is given: check its spelling (special letters ${CONFIG.letters.join(' ')}) and give a short ${CONFIG.nativeLang} dictionary translation (main meanings, comma-separated; add a short clarification in parentheses only if needed).
- If only ${CONFIG.nativeLang} is given: give the most common ${CONFIG.targetLang} equivalent for a learner (nouns in base/dictionary form, verbs in the dictionary infinitive). If two common words exist, give the main one and mention the other in the comment.
- If both are given: check the ${CONFIG.targetLang} spelling and whether the pair really matches. Treat it as correct if it is a correct translation, even if not the only one.
Reply ONLY with JSON:
{"correct": true/false (false only if something the student wrote is wrong: misspelled or the pair does not match),
 "tr": "${CONFIG.targetLang} word to save (corrected if needed)",
 "ru": "${CONFIG.nativeLang} translation to save (corrected or filled in)",
 "comment": "1-2 short sentences in ${CONFIG.nativeLang}: what was wrong and why, or a useful note (e.g. how it differs from a similar word). Empty string if nothing to add."}`;
  return await sampler.json(prompt,{modelTier:'default',cache:false});
}
function wordForm(box,setId,w){ // add (w=null) or correct an existing word
  const s=SETS.find(x=>x.id===setId);
  box.innerHTML=`<div class="panel wf">
    <h3 style="font-size:1.05rem">${w?'Исправить слово':'Добавить слово'}</h3>
    <div class="small muted">${w?'Измени '+U.tNeut+' слово или перевод. Claude проверит, что пара верная.':'Можно написать только '+U.tNeut+' слово, только '+U.nNeut+' или оба. Claude допишет перевод или проверит пару.'}</div>
    <div class="fields"><label>${CONFIG.targetLabel}<input type="text" id="wfTr" placeholder="например, torun" value="${w?esc(w.tr):''}" autocomplete="off" autocapitalize="off" spellcheck="false"></label><label>${U.nLabel}<input type="text" id="wfRu" placeholder="например, внук" value="${w?esc(w.ru):''}" autocomplete="off"></label></div>
    <div class="row"><button class="primary" id="wfCheck">Проверить</button><button class="ghost" id="wfCancel">Отмена</button></div>
    <div id="wfRes"></div></div>`;
  const back=()=>{const y=scrollY;setView(setId);scrollTo(0,y)};
  $('#wfCancel').onclick=back;
  $('#wfCheck').onclick=async()=>{
    const tr=$('#wfTr').value.trim(), ru=$('#wfRu').value.trim(), res=$('#wfRes');
    if(!tr&&!ru){res.innerHTML='<div class="fb bad">Напиши хотя бы одно слово.</div>';return}
    const dup=WORDS.find(x=>x!==w&&tr&&norm(x.tr)===norm(tr));
    res.innerHTML='<div class="muted small">Claude проверяет…</div>'; $('#wfCheck').disabled=true;
    let r=null; try{r=await checkWord(tr,ru,s.ru)}catch(e){r=null}
    $('#wfCheck').disabled=false;
    const dup2=dup||(r&&r.tr?WORDS.find(x=>x!==w&&norm(x.tr)===norm(r.tr)):null);
    const dupNote=dup2?`<div class="small muted">Такое слово уже есть в наборе «${esc((SETS.find(x=>x.id===dup2.set)||{}).ru||'')}»: ${esc(dup2.tr)} = ${esc(dup2.ru)}.</div>`:'';
    if(!r||!r.tr||!r.ru){
      if(tr&&ru){res.innerHTML=`<div class="fb near">Проверка сейчас недоступна. Сохранить без проверки?</div>${dupNote}<div class="row"><button id="wfMine">Сохранить как есть</button></div>`;
        $('#wfMine').onclick=()=>{saveWord(w,tr,ru,setId);back()}}
      else res.innerHTML='<div class="fb bad">Проверка сейчас недоступна, поэтому перевод не дописать. Напиши оба слова или попробуй позже.</div>';
      return}
    const same=tr&&ru&&norm(r.tr)===norm(tr)&&norm(r.ru)===norm(ru);
    const filled=!(tr&&ru);
    const head=r.correct===false?`<div class="fb bad">Есть ошибка. Claude предлагает: <b>${esc(r.tr)}</b> = ${esc(r.ru)}</div>`
      :same?`<div class="fb ok">✓ Верно: <b>${esc(r.tr)}</b> = ${esc(r.ru)}</div>`
      :`<div class="fb ok">${filled?'Claude дописал:':'✓ Верно, чуть уточнил:'} <b>${esc(r.tr)}</b> = ${esc(r.ru)}</div>`;
    res.innerHTML=head+(r.comment?`<div class="small">${esc(r.comment)}</div>`:'')+dupNote+
      `<div class="row"><button class="primary" id="wfSave">Сохранить${same?'':' вариант Claude'}</button>${(!same&&tr&&ru)?'<button class="ghost" id="wfMine">Сохранить как есть</button>':''}</div>`;
    $('#wfSave').onclick=()=>{saveWord(w,r.tr.trim(),r.ru.trim(),setId);back()};
    const m=$('#wfMine'); if(m) m.onclick=()=>{saveWord(w,tr,ru,setId);back()};
  };
  $('#wfTr').focus(); box.scrollIntoView({block:'nearest'});
}

  const m=it.q.match(/([\p{L}\p{M}'’]*)___/u);
  if(gaps===1&&m&&m[1]){const np=exCmp(m[1]);
    for(const v of vs.slice()){const nv=exCmp(v);
      if(nv.startsWith(np)){const rest=nv.slice(np.length).trim();if(rest)vs.push(rest);else vs.push('-','—','0','нет','ничего')}
      else if(np.length>2&&nv.startsWith(np.slice(0,-1))){vs.push(nv.slice(np.length-1),nv.slice(np.length))} // k→ğ, p→b, t→d, ç→c

    vs.push(exFill(it))}
  return [...new Set(vs.filter(Boolean))];
}
const exFill=it=>{const a=String(it.a||'').split('|')[0].replace(/[()]/g,'');const m=it.q.match(/([\p{L}\p{M}'’]*)___/u);

function synonymOf(input,w){const a=norm(input||'');if(!a)return null;const o=WORDS.find(x=>x!==w&&norm(x.tr)===a);if(!o)return null;const A=ruCore(w.ru),B=ruCore(o.ru);return A.some(x=>B.includes(x))?o:null}

// explain how an answer differs from the correct one
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function letterDiff(input,correct){
  const a=norm(input), b=norm(correct); const out=[];
  if(a.length===b.length){for(let k=0;k<a.length;k++)if(a[k]!==b[k])out.push(`«${b[k]}», а не «${a[k]}»`)}
  return out.length?'Нужно '+[...new Set(out)].join(', ')+'.':'Проверь '+U.tPl+' буквы.';
}
function whyWrong(input,correct){
  const a=norm(input||''); if(!a)return 'Не вспомнилось.';
  const b=norm(correct); const d=lev(a,b);
  if(d<=2||d<=b.length*0.25){
    const aw=a.split(' '), bw=b.split(' ');
    if(aw.length===bw.length){const bad=bw.filter((w,k)=>w!==aw[k]);if(bad.length===1)return `Ошибка в слове «${bad[0]}»: написано «${aw[bw.indexOf(bad[0])]}».`}
    return 'Почти: ошибка в написании или окончании.';
  }
  return 'Другой ответ.';
}
const ST={ok:['✓','ok'],hint:['½','near'],near:['≈','near'],bad:['✗','due'],skip:['–','due'],known:['★','known']};

  const recs=Object.entries(groups).filter(([g,x])=>(x.bad>=2&&x.bad/x.n>=0.3)||(x.bad>=1&&x.bad/x.n>=0.5)).sort((a,b)=>b[1].bad/b[1].n-a[1].bad/a[1].n);

  view().innerHTML=`<div class="panel"><h2>Готово: ${esc(title)}</h2>
    <div>Верно ${fmt1(okN)} из ${rec.length} (${rec.length?Math.round(100*okN/rec.length):0}%).</div>

    <div class="row"><button class="primary" id="home">На главную</button></div></div>`;
  $('#home').onclick=home; renderStats();
  view().querySelectorAll('[data-open-rule]').forEach(b=>b.onclick=()=>ruleView(b.dataset.openRule));

// ---------- rule reader ----------
function mdInline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')}
function md(src){
  const lines=src.split('\n'); let html='', i=0;
  while(i<lines.length){const l=lines[i];
    if(/^\|/.test(l)){const rows=[];while(i<lines.length&&/^\|/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const body=rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
      html+='<div style="overflow-x:auto"><table class="md">'+body.map((r,k)=>'<tr>'+cells(r).map(c=>k===0?`<th>${mdInline(c)}</th>`:`<td>${mdInline(c)}</td>`).join('')+'</tr>').join('')+'</table></div>';continue}
    if(/^## /.test(l)){html+=`<h3>${mdInline(l.slice(3))}</h3>`}
    else if(/^# /.test(l)){html+=`<h2>${mdInline(l.slice(2))}</h2>`}
    else if(/^\s*[-*] /.test(l)){html+='<ul>';while(i<lines.length&&/^\s*[-*] /.test(lines[i])){html+=`<li>${mdInline(lines[i].replace(/^\s*[-*] /,''))}</li>`;i++}html+='</ul>';continue}
    else if(/^\d+\. /.test(l)){html+='<ol>';while(i<lines.length&&/^\d+\. /.test(lines[i])){html+=`<li>${mdInline(lines[i].replace(/^\d+\. /,''))}</li>`;i++}html+='</ol>';continue}
    else if(l.trim()){html+=`<p>${mdInline(l)}</p>`}
    i++}
  return html;
}

function cards(list,snap){
  let i=snap?snap.i:0, flipped=false, ruFirst=snap?!!snap.ruFirst:false; const rec=snap?snap.rec:[];
  const persist=()=>saveRun({kind:'cards',list:list.map(w=>w.tr),i,rec,ruFirst});
  const okN=()=>rec.filter(r=>r.st==='ok'||r.st==='known').length;
  const draw=()=>{
    finishHook=()=>{i=list.length;draw()};
    if(i>=list.length){summary('Карточки',rec);return}
    persist();
    const w=list[i];
    const front=ruFirst?w.ru:w.tr, back=ruFirst?w.tr:w.ru;
    view().innerHTML=`<div class="panel">${header('Карточки',i+1,list.length,okN(),rec.length)}
      <div class="row small"><label><input type="checkbox" id="dir" ${ruFirst?'checked':''}> сначала ${U.nNeut}</label></div>
      <div class="card" id="card"><div class="big">${esc(front)}</div>${flipped?`<div class="ans">${esc(back)}</div>`:'<div class="muted small">нажми, чтобы перевернуть</div>'}${speakBtn(w.tr)}</div>
      ${flipped?`<div class="row"><button id="no">Не знаю</button><button id="yes" class="primary">Знаю</button><button class="ghost" id="known">Знаю точно, убрать</button></div>`:''}
    </div>`;
    bindBack(); bindSay();
    $('#dir').onchange=e=>{ruFirst=e.target.checked;flipped=false;draw()};
    $('#card').onclick=()=>{flipped=!flipped;draw()};
    const add=st=>rec.push({set:w.set,q:w.ru,correct:w.tr,st,why:st==='bad'?'Не знаю: слово вернётся в следующий раз.':st==='known'?'Убрано: знаю точно.':''});
    if(flipped){
      $('#yes').onclick=()=>{grade(w,'okSoft');add('ok');i++;flipped=false;draw()};
      $('#no').onclick=()=>{grade(w,'bad');add('bad');i++;flipped=false;draw()};
      $('#known').onclick=()=>{markKnown(w);add('known');i++;flipped=false;draw()};
    }
  };
  draw();
}

function match(list,ruLeft,snap){
  const rounds=[];for(let k=0;k<list.length;k+=6)rounds.push(list.slice(k,k+6));
  let r=snap?snap.r:0; const rec=snap?snap.rec:[];
  const name=ruLeft?'Сопоставь: '+U.nAdj+' → '+U.tAdj:'Сопоставь: '+U.tAdj+' → '+U.nAdj;
  const drawRound=()=>{
    finishHook=()=>{r=rounds.length;drawRound()};
    if(r>=rounds.length){summary(name,rec);return}
    saveRun({kind:'match',list:list.map(w=>w.tr),ruLeft,r,rec});
    const ws=rounds[r]; const missed={}; let sel=null, left=ws.length;
    const L=shuffle(ws), R=shuffle(ws);
    const lt=w=>ruLeft?w.ru:w.tr, rt=w=>ruLeft?w.tr:w.ru;
    const okN=()=>rec.filter(x=>x.st==='ok').length;
    const paint=()=>{const h=view().querySelector('.progress-wrap');if(h)h.innerHTML=header(name,Math.min(rec.length+1,list.length),list.length,okN(),rec.length);bindBack()};
    view().innerHTML=`<div class="panel"><div class="progress-wrap" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="small muted">Раунд ${r+1} из ${rounds.length}</div>
      <div class="match"><div class="col">${L.map(w=>`<button data-l="${esc(w.tr)}">${esc(lt(w))}</button>`).join('')}</div>
      <div class="col">${R.map(w=>`<button data-r="${esc(w.tr)}">${esc(rt(w))}</button>`).join('')}</div></div></div>`;
    paint();
    // either column can be tapped first; the second tap on the other column makes the pair
    const pick=(b,side)=>{
      if(b.classList.contains('done'))return;
      if(!sel||sel.side===side){view().querySelectorAll('[data-l],[data-r]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel={b,side};return}
      const first=sel, lb=side==='l'?b:first.b, rb=side==='r'?b:first.b;
      const w=ws.find(x=>x.tr===first.b.dataset[first.side]);
      if(lb.dataset.l===rb.dataset.r){
        lb.classList.add('done');rb.classList.add('done');lb.classList.remove('sel');rb.classList.remove('sel');
        const wm=ws.find(x=>x.tr===lb.dataset.l);
        if(!ruLeft) speak(wm.tr);
        const m=missed[wm.tr];
        if(!m){grade(wm,'okSoft');rec.push({set:wm.set,q:lt(wm),correct:rt(wm),st:'ok'})}
        else {grade(wm,'bad');rec.push({set:wm.set,q:lt(wm),correct:rt(wm),st:'bad',why:'Сначала выбрано: «'+[...m].join('», «')+'».'})}
        sel=null; paint(); if(--left===0){r++;setTimeout(drawRound,450)}
      } else {
        const other=ws.find(x=>x.tr===b.dataset[side]);
        (missed[w.tr]=missed[w.tr]||new Set()).add(side==='r'?rt(other):lt(other));
        b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);
      }
    };
    view().querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>pick(b,'l'));
    view().querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>pick(b,'r'));
  };
  drawRound();
}

function norm(s){return s.toLocaleLowerCase(CONFIG.targetCode).replace(/['’`]/g,'').replace(/[.,!?;:"«»()—-]/g,' ').replace(/\s+/g,' ').trim()}
function strip(s){return norm(s).split('').map(c=>CONFIG.letterMap[c]||c).join('')}
function variants(tr){return tr.split('/').map(x=>x.replace(/\.\.\./g,'').trim()).filter(Boolean)}
function check(input,w){
  const a=norm(input); if(!a)return 'bad';
  const vs=variants(w.tr);
  if(vs.some(v=>norm(v)===a)||norm(w.tr)===a)return 'ok';
  if(vs.some(v=>strip(v)===strip(input)))return 'near';
  return 'bad';
}

function gradeRule(id,ok,n){
  const k='r:'+id; const x=state.items[k]||startItem(ruleCov(id));
  const ratio=n?ok/n:0;
  if(ratio>=0.8){x.b=Math.min(x.b+1,INTERVALS.length-1);x.due=addDays(Math.max(1,INTERVALS[x.b]))}
  else if(ratio>=0.5){x.due=addDays(1)}
  else {x.b=Math.max(0,x.b-2);x.due=addDays(1)}
  x.c+=ok; x.w+=n-ok; x.last=today(); state.items[k]=x; scheduleSave(); renderStats();
}

let WRIT=[], sampler=null;
async function checkSentence(task,answer){
  if(sampler){
    const prompt=`You are a kind, precise ${CONFIG.targetLang} teacher. The student is a ${CONFIG.nativeLang} speaker at level ${CONFIG.level}${CONFIG.book?' (book "'+CONFIG.book+'"'+(CONFIG.covered?', covered so far: '+CONFIG.covered:'')+')':''}. Only expect grammar the student has covered.

${task.m?'One correct reference answer: '+task.m:'This is a free-writing task: any correct ${CONFIG.targetLang} that fulfils the task is fine.'}
Student's answer: ${answer}

Check grammar, endings/agreement, word choice, spelling (special letters ${CONFIG.letters.join(' ')} count) and whether it fulfils the task. Different word order or synonyms are fine if correct. A missing capital letter or final punctuation is not an error.
Reply ONLY with JSON:
{"score": 0-100 (100 = fully correct; minus points per real error),
 "corrected": "the student's text with errors fixed, keeping their wording where it was right",
 "comment": "1-2 short sentences in ${CONFIG.nativeLang}: overall feedback",
 "errors": [{"wrong": "...", "right": "...", "why": "short reason in ${CONFIG.nativeLang}, name the rule"}],

function essayWords(n){ // words being learned: due first, then learning/familiar ones, then covered unseen ones
  const live=w=>!isKnown(w)&&w.tr.split(' ').length<=2;
  const due=shuffle(dueWords().filter(live));
  const learn=shuffle(WORDS.filter(w=>{const x=it(w);return x&&live(w)&&!x.known&&x.b<5&&!due.includes(w)}));
  const cov=shuffle(WORDS.filter(w=>isCov(w)&&live(w)));
  return [...due,...learn,...cov].slice(0,n);
}
function essayRule(ids){
  const ok=r=>!r.planned&&!ruleKnown(r.id)&&(r.covered||state.items['r:'+r.id]);
  if(ids&&ids.length){const r=RULES.find(x=>x.id===ids[0]);if(r)return r}
  const live=RULES.filter(ok); return live.length?shuffle(live)[0]:null;
}
// is a given word used in the text in any form? (verbs without -mak/-mek, consonant softening k>ğ/g, t>d, p>b, ç>c, dropped final vowel before -iyor)
const SOFT={k:['ğ','g'],t:['d'],p:['b'],'ç':['c']};
function stems(part,last){const out=new Set([part]);let r=part;
  if(last&&/(mak|mek)$/.test(r)&&r.length>4){r=r.slice(0,-3);out.add(r)}
  const end=r.slice(-1);if(SOFT[end]&&r.length>2)for(const c of SOFT[end])out.add(r.slice(0,-1)+c);
  if(/[aeıioöuü]$/.test(r)&&r.length>3)out.add(r.slice(0,-1));
  if(r.length>2&&r!==part)out.add(r);
  if(last&&CONFIG.targetCode==='tr'&&(r==='ye'||r==='de')){out.add(r);out.add(r[0]+'i')}
  return [...out]}
const wordUsed=(text,w)=>{const toks=norm(text).split(' ');const parts=norm(w.tr).split(' / ')[0].split(' ').filter(Boolean);
  return parts.every((part,k)=>{const st=stems(part,k===parts.length-1);return toks.some(t=>st.some(x=>t.startsWith(x)))})};

function compSize(kind){
  const lv=String(CONFIG.level||'A1').slice(0,2).toUpperCase(); const r=COMP_SIZE[kind][lv]||COMP_SIZE[kind].A1;

    view().querySelectorAll('[data-ans]').forEach(b=>b.onclick=()=>{if(answered!=null)return;const q=t.qs[i];answered=b.dataset.ans;
      const right=String(q.answer), ok=answered===right;
      const lab=v=>q.type==='tf'?(v==='true'?'Doğru (верно)':'Yanlış (неверно)'):q.options[+v];
      rec.push({q:q.q,tr:q.q_tr,correct:lab(right),your:ok?'':lab(answered),st:ok?'ok':'bad',why:ok?'':q.why});
      const y=scrollY;draw();scrollTo(0,y)});
    const nx=$('#next'); if(nx) nx.onclick=()=>{answered=null;i++;
      if(i>=t.qs.length){stopAudio();
        const full=`<details><summary><b>${listen?'Текст записи':'Текст'} с переводом</b></summary><div style="margin-top:6px;display:flex;flex-direction:column;gap:8px">${t.lines.map(l=>`<div>${listen&&l.speaker?`<b>${esc(l.speaker)}:</b> `:''}${tapify(l.text)}<div class="small muted">${esc(l.tr)}</div></div>`).join('')}</div></details>`;
        summary(NAME,rec,full);return}
      draw();const q=$('#q');if(q)q.scrollIntoView({block:'nearest'})};
    bindSay();
  };
  if(tts&&tts.onLine&&!comprehension.hooked){comprehension.hooked=true;try{tts.onLine(({id})=>{const k=id&&id.startsWith('l')?+id.slice(1):-1;compCur=k;document.querySelectorAll('[data-line]').forEach(x=>x.style.background=+x.dataset.line===k?'color-mix(in srgb,var(--warn) 22%,transparent)':'')})}catch(e){}}
  draw();
}

// ---------- sort "Words from exercises" into topic sets ----------
async function distribute(ws){
  const box=$('#distBox'); if(!ws.length){box.innerHTML='<div class="small muted">Здесь нет слов, которые можно перенести.</div>';return}
  if(!sampler){box.innerHTML='<div class="small muted">Сейчас нельзя спросить Claude. Попробуй позже.</div>';return}
  box.innerHTML='<div class="small muted">Подбираю наборы…</div>';
  const prompt=`A ${CONFIG.nativeLang}-speaking learner of ${CONFIG.targetLang} collected these words while doing exercises:
${ws.map(w=>w.tr+' = '+w.ru).join('\n')}
Existing word sets (id = topic): ${setList()}
For each word choose the existing set whose topic clearly fits it. If 5 or more of the words share one clear topic that no existing set covers, propose a new set for them instead. Words that fit nowhere stay with "set": "".
Reply ONLY with JSON:
{"words": [{"word": "word exactly as listed", "set": "existing set id, or new:N for the N-th new set (from 1), or empty"}],
 "newSets": [{"ru": "set name in ${CONFIG.nativeLang}", "tr": "set name in ${CONFIG.targetLang}"}]}`;
  let r; try{r=await sampler.json(prompt,{modelTier:'default',cache:false})}catch(e){box.innerHTML=`<div class="fb bad">Не получилось (${esc(e&&e.code||'ошибка')}). Попробуй ещё раз позже.</div>`;return}
  const ns=(r&&r.newSets)||[]; const plan=[];
  for(const x of (r&&r.words)||[]){const w=ws.find(q=>norm(q.tr)===norm(x.word||''));if(!w)continue;const to=String(x.set||'');
    if(to.startsWith('new:')){const k=+to.slice(4)-1;if(ns[k])plan.push({w,to,newK:k})}else if(to&&to!==EX_SET.id&&SETS.some(q=>q.id===to))plan.push({w,to})}
  const groups=ns.map((n,k)=>({n,k,ws:plan.filter(p=>p.newK===k)})).filter(g=>g.ws.length>=5);
  const moves=plan.filter(p=>p.newK==null);
  // words planned for a new set that ended up too small stay where they are
  if(!moves.length&&!groups.length){box.innerHTML='<div class="small muted">Подходящих наборов для этих слов нет: пусть пока остаются здесь.</div>';return}
  const opt=(sel)=>`<option value="${EX_SET.id}">оставить здесь</option>`+SETS.filter(q=>q.id!==EX_SET.id).map(q=>`<option value="${esc(q.id)}"${q.id===sel?' selected':''}>${esc(q.ru)}</option>`).join('');
  box.innerHTML=`${moves.length?`<b>Перенести в наборы</b><div class="small muted">Можно поменять набор у любого слова.</div>
    <table style="width:100%;border-collapse:collapse">${moves.map((p,i)=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 8px 6px 0"><b>${esc(p.w.tr)}</b> <span class="small muted">${esc(p.w.ru)}</span></td><td style="text-align:right"><select data-mv="${i}" style="font:inherit;max-width:190px">${opt(p.to)}</select></td></tr>`).join('')}</table>`:''}
    ${groups.map(g=>`<div class="offer" style="margin-top:6px"><b>Новый набор «${esc(g.n.ru)}»?</b> <span class="small muted">${g.ws.length} слов: ${g.ws.map(p=>esc(p.w.tr)).join(', ')}</span><label class="row small" style="gap:6px;margin-top:4px"><input type="checkbox" data-ng="${g.k}" checked> создать этот набор</label></div>`).join('')}
    <div class="row"><button class="primary" id="distGo">Перенести</button><button class="ghost" id="distNo">Отмена</button></div>`;
  $('#distNo').onclick=()=>setView(EX_SET.id);
  $('#distGo').onclick=()=>{let n=0;
    moves.forEach((p,i)=>{const to=box.querySelector(`[data-mv="${i}"]`).value;if(to!==EX_SET.id){moveAdded(p.w.tr,to);n++}});
    for(const g of groups){if(!box.querySelector(`[data-ng="${g.k}"]`).checked)continue;const id=newSet(g.n.ru,g.n.tr);g.ws.forEach(p=>{moveAdded(p.w.tr,id);n++})}
    applyCustom(); scheduleSave(); setView(EX_SET.id);
    const b2=$('#distBox'); if(b2) b2.insertAdjacentHTML('afterbegin',`<div class="fb ok small">Перенесено слов: ${n}.</div>`);
    else view().querySelector('.panel').insertAdjacentHTML('beforeend',`<div class="fb ok small">Перенесено слов: ${n}. Здесь больше ничего не осталось.</div>`)};
}


// ---------- a new word set: typed by the learner or generated by Claude ----------
async function fillPairs(lines,topic){ // lines: "target - native", or only one side; Claude fills and corrects
  const raw=lines.map(l=>l.split(/\s+[-–—=]\s+|\t/).map(x=>x.trim()));
  if(!sampler) return raw.filter(x=>x[0]&&x[1]).map(x=>({tr:x[0],ru:x[1],note:''}));
  const prompt=`A ${CONFIG.nativeLang}-speaking ${CONFIG.level} learner of ${CONFIG.targetLang} is making a word set${topic?' "'+topic+'"':''}. Each line is a ${CONFIG.targetLang} word, a ${CONFIG.nativeLang} word, or both separated by " - ":
${lines.join('\n')}
For each line give the ${CONFIG.targetLang} dictionary form and a short ${CONFIG.nativeLang} translation. Fix spelling (special letters ${CONFIG.letters.join(' ')}) and wrong translations, and say what you changed.
Reply ONLY with JSON: {"words": [{"tr": "...", "ru": "...", "note": "short ${CONFIG.nativeLang} note on a correction, or empty"}]}`;
  const r=await sampler.json(prompt,{modelTier:'default',cache:false}); return ((r&&r.words)||[]).filter(x=>x&&x.tr&&x.ru);
}
async function genWords(topic,n,also){
  const have=WORDS.map(w=>w.tr).concat(also||[]).join(', ');
  const prompt=`Make a word set "${topic}" for a ${CONFIG.nativeLang}-speaking learner of ${CONFIG.targetLang} at level ${CONFIG.level}. Give the ${n} most useful words and short phrases for this topic at this level (nouns, verbs, adjectives), in dictionary form, with short ${CONFIG.nativeLang} translations. Do not repeat words the learner already has: ${have}.
Reply ONLY with JSON: {"tr_name": "set name in ${CONFIG.targetLang}", "words": [{"tr": "...", "ru": "..."}]}`;
  return await sampler.json(prompt,{modelTier:'default',cache:false});
}
function newSetView(){
  stopTimer(); tapCtx=null;
  view().innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between"><h2>Новый набор слов</h2><button class="ghost" id="back">← На главную</button></div>
    <label class="small"><b>Тема набора</b> <span class="muted">(например: «В ресторане», «Спорт», «Моя работа»)</span></label>
    <input id="nsName" autocomplete="off" style="font:inherit;font-size:1.05rem;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)">
    <div class="modes">
      <button id="nsGen" class="primary"><b>Сгенерировать</b><span class="small">Claude подберёт самые нужные слова по теме для твоего уровня</span></button>
      <button id="nsOwn"><b>Ввести свои слова</b><span class="small muted">впиши свои слова; Claude проверит и добавит перевод</span></button>
    </div>
    <div id="nsBox"></div></div>`;
  $('#back').onclick=home;
  const name=()=>$('#nsName').value.trim(); const need=()=>{if(name())return true;$('#nsName').focus();$('#nsBox').innerHTML='<div class="fb near small">Сначала напиши тему набора.</div>';return false};
  let shown=[],trKeep=''; // words on screen; "more" adds to them
  const preview=(words,trName,mode)=>{ // mode: 'gen' new generated list, 'more' generated extra words, '' own words
    if(mode==='more') view().querySelectorAll('[data-ns]').forEach(c=>{if(shown[+c.dataset.ns])shown[+c.dataset.ns].off=!c.checked}); else {shown=[];trKeep=''}
    if(trName&&!trKeep) trKeep=trName;
    const known=new Set(WORDS.map(w=>norm(w.tr)).concat(shown.map(w=>norm(w.tr)))); const fresh=[];
    for(const w of words){const k=norm(w.tr);if(!known.has(k)){known.add(k);fresh.push(w)}}
    const dup=words.length-fresh.length; const list=shown=shown.concat(fresh);
    if(!list.length){$('#nsBox').innerHTML=`<div class="fb near">Все эти слова уже есть в твоих наборах.</div>`;return}
    const gen=mode==='gen'||mode==='more';
    $('#nsBox').innerHTML=`<b>Слова для набора «${esc(name())}» · ${list.length}</b><div class="small muted">Сними галочку со слов, которые не нужны.${dup?` Повторы пропущены: ${dup}.`:''}${mode==='more'&&!fresh.length?' Новых слов не нашлось, попробуй ещё раз.':''}</div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">${list.map((w,i)=>`<tr style="border-bottom:1px solid var(--line)"><td style="padding:6px 6px 6px 0"><input type="checkbox" data-ns="${i}" ${w.off?'':'checked'}></td><td style="padding:6px 8px;font-weight:600">${esc(w.tr)}</td><td style="padding:6px 8px">${esc(w.ru)}${w.note?`<div class="small" style="color:var(--coral)">${esc(w.note)}</div>`:''}</td></tr>`).join('')}</table></div>
      ${gen?`<div class="row"><span class="small">Сгенерировать ещё:</span>${[5,10,15].map(n=>`<button class="small" data-more="${n}">+${n}</button>`).join('')}<span class="small muted" id="nsMoreSt"></span></div>`:''}
      <div class="row"><button class="primary" id="nsMake">Создать набор</button></div>`;
    view().querySelectorAll('[data-more]').forEach(b=>b.onclick=async()=>{const st=$('#nsMoreSt');view().querySelectorAll('[data-more]').forEach(x=>x.disabled=true);st.textContent='Подбираю ещё…';
      try{const r=await genWords(name(),+b.dataset.more,shown.map(w=>w.tr));preview((r&&r.words||[]).filter(x=>x&&x.tr&&x.ru),r&&r.tr_name,'more')}
      catch(e){st.textContent=`Не получилось (${e&&e.code||'ошибка'}). Попробуй ещё раз.`;view().querySelectorAll('[data-more]').forEach(x=>x.disabled=false)}});
    $('#nsMake').onclick=()=>{const pick=list.filter((w,i)=>$(`[data-ns="${i}"]`).checked);if(!pick.length)return;
      const id=newSet(name(),trKeep||''); const c=cust(); pick.forEach(w=>c.add.push({tr:w.tr,ru:w.ru,set:id})); applyCustom(); scheduleSave(); renderStats(); setView(id)}};
  const pick=on=>{$('#nsGen').classList.toggle('primary',on==='gen');$('#nsOwn').classList.toggle('primary',on==='own');view().querySelectorAll('#nsGen .small,#nsOwn .small').forEach(x=>x.classList.toggle('muted',!x.closest('.primary')))};
  $('#nsGen').onclick=()=>{if(!need())return; pick('gen');
    if(!sampler){$('#nsBox').innerHTML='<div class="fb near small">Сейчас нельзя спросить Claude. Введи свои слова или попробуй позже.</div>';return}
    $('#nsBox').innerHTML=`<div class="row"><span class="small">Сколько слов?</span>${[10,15,20].map(n=>`<button class="small" data-gn="${n}">${n}</button>`).join('')}</div>`;
    view().querySelectorAll('[data-gn]').forEach(b=>b.onclick=async()=>{$('#nsBox').innerHTML='<div class="small muted">Подбираю слова…</div>';
      try{const r=await genWords(name(),+b.dataset.gn);preview((r&&r.words||[]).filter(x=>x&&x.tr&&x.ru),r&&r.tr_name,'gen')}catch(e){$('#nsBox').innerHTML=`<div class="fb bad">Не получилось (${esc(e&&e.code||'ошибка')}). Попробуй ещё раз.</div>`}})};
  $('#nsOwn').onclick=()=>{if(!need())return; pick('own');
    $('#nsBox').innerHTML=`<div class="small muted">По одному слову на строку: можно только ${U.tNeut}, только ${U.nNeut} или оба через « - » (например: <i>masa - стол</i>).</div>
      <textarea id="nsList" rows="8" autocomplete="off" autocapitalize="off" spellcheck="false" style="font:inherit;width:100%;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)"></textarea>
      ${KEYS()}<div class="row"><button class="primary" id="nsCheck">Проверить слова</button><button class="ghost" id="nsEmpty">Создать пустой набор</button></div>`;
    bindKeys($('#nsList'),()=>false);
    $('#nsEmpty').onclick=()=>{const id=newSet(name(),'');scheduleSave();setView(id)};
    $('#nsCheck').onclick=async()=>{const lines=$('#nsList').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length){$('#nsList').focus();return}
      $('#nsBox').insertAdjacentHTML('beforeend','<div class="small muted" id="nsWait">Проверяю…</div>');
      try{preview(await fillPairs(lines,name()),'')}catch(e){const w=$('#nsWait');if(w)w.outerHTML=`<div class="fb bad">Не получилось проверить (${esc(e&&e.code||'ошибка')}). Попробуй ещё раз.</div>`}}};
  $('#nsName').focus();
}

// ---------- boot ----------
async function boot(){
  try{
    const [w,r,g,wr]=await Promise.all([fetch('words.json',{cache:'no-store'}).then(x=>x.json()),fetch('rules.json',{cache:'no-store'}).then(x=>x.json()),fetch('grammar.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>({})),fetch('writing.json',{cache:'no-store'}).then(x=>x.json()).catch(()=>[])]); GRAM=g; WRIT=wr;
    fetch('exercises.json',{cache:'no-store'}).then(x=>x.ok?x.json():{}).then(e=>{EXR=e||{}}).catch(()=>{});
    SETS=w.sets; if(!SETS.some(x=>x.id===EX_SET.id)) SETS.push(EX_SET); BASE=[]; for(const s of SETS)for(const [tr,ru] of s.words)BASE.push({tr,ru,set:s.id}); RULES=r;
  }catch(e){view().innerHTML='<div class="panel">Не удалось загрузить слова. Обнови страницу.</div>';return}
  try{const ls=localStorage.getItem('tt_state');if(ls)state=Object.assign(state,JSON.parse(ls))}catch(e){}
  applyCustom(); if(migrateCovered())scheduleSave();
  $('#dueTile').onclick=dueView;
  {const t=$('#ttl');if(t)t.textContent=CONFIG.targetLabel+' Trainer';document.title=CONFIG.targetLabel+' Trainer'}
  {const s=$('#sub');if(s)s.innerHTML='Уровень '+esc(CONFIG.level)+(CONFIG.book?' · '+esc(CONFIG.book):'')}
  renderStats(); home();
  if(!window.claude||!window.claude.use){showNotice('Прогресс сохраняется только в этом браузере.');return}
  window.claude.use('sample').then(sm=>{sampler=sm}).catch(()=>{});
  window.claude.use('tts').then(t=>{tts=t; if(!activeTick) home()}).catch(()=>{});
  let timedOut=false; const timer=setTimeout(()=>{timedOut=true;showNotice('Сервер прогресса не ответил. Прогресс сохраняется в этом браузере.')},10000);
  try{
    db=await window.claude.use('db');
    if(!db){clearTimeout(timer);showNotice('Прогресс сохраняется только в этом браузере.');return}
    docRef=db.doc('progress/main');
    const snap=await docRef.get(); clearTimeout(timer); if(timedOut) $('#notice').hidden=true;
    if(snap.exists){const remote=JSON.parse(JSON.stringify(snap.data())); // a plain copy: the stored data may be read-only
      // merge: keep remote items, overlay local items that are newer
      const items=Object.assign({},remote.items||{});
      for(const [k,v] of Object.entries(state.items||{})){if(!items[k]||(v.last||'')>(items[k].last||''))items[k]=v}
      const daily=Object.assign({},remote.daily||{});for(const [k,v] of Object.entries(state.daily||{}))daily[k]=Math.max(daily[k]||0,v);
      const rc=remote.custom||{}, lc=state.custom||{};
      const add=(rc.add||[]).slice(); for(const a of (lc.add||[])){const k=add.findIndex(b=>b.tr===a.tr);if(k<0)add.push(a);else add[k]=a}
      const sets=(rc.sets||[]).slice(); for(const a of (lc.sets||[])) if(!sets.some(b=>b.id===a.id)) sets.push(a);
      const custom={add,edit:Object.assign({},rc.edit||{},lc.edit||{}),del:[...new Set([...(rc.del||[]),...(lc.del||[])])],sets};
      const requests=(remote.requests||[]).slice(); for(const a of (state.requests||[])) if(!requests.some(b=>b.key===a.key)) requests.push(a);
      state={items,daily,log:(remote.log||[]).concat(),custom,requests,prefs:Object.assign({},state.prefs||{},remote.prefs||{})};
      applyCustom();
    }
    migrateCovered(); startRequested();
    renderStats(); if(!activeTick) home(); scheduleSave();
  }catch(e){clearTimeout(timer);showNotice('Прогресс сохраняется только в этом браузере.')}
}
boot();
})();
</script>
